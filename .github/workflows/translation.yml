name: Bilingual sync
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bilingual-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.prepare.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test automation
        run: python3 .github/translation/test_sync.py
      - name: Prepare baseline and dictionary
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/translation/sync.py prepare
      - name: Check API key
        if: steps.prepare.outputs.translate == 'true'
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Add OPENAI_API_KEY in repository Actions secrets, then rerun."
            exit 1
          fi
      - name: Translate
        if: steps.prepare.outputs.translate == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/translation/prompt.md
          sandbox: read-only
          codex-args: '["--output-schema", ".github/translation/schema.json"]'
          output-file: .run/result.json
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.needed == 'true'
        with:
          name: translation-result
          path: .run/*.json
          retention-days: 7

  publish:
    needs: translate
    if: needs.translate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: translation-result
          path: .run
      - name: Validate and propose changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote rename origin github
          python3 .github/translation/sync.py publish
